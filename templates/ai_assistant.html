<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4338ca;
            color: white;
            border: none;
            padding: 12px 22px;
            margin-top: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        #response {
            background: #f8fafc;
            padding: 18px;
            margin-top: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        a {
            color: #4338ca;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Study Assistant</h1>

    <p>Ask any Engineering study question.</p>

    <textarea id="question"
        placeholder="Enter your question here..."></textarea>

    <button onclick="askQuestion()">Ask AI</button>

    <div id="response"></div>

    <br>

    <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>

</div>

<script>
async function askQuestion() {

    const question = document.getElementById("question").value.trim();
    const responseBox = document.getElementById("response");

    if (!question) {
        responseBox.textContent = "Please enter your question.";
        return;
    }

    responseBox.textContent = "AI is thinking...";

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok) {
            responseBox.textContent = data.error || "Something went wrong.";
            return;
        }

        responseBox.textContent = data.answer || "No answer received.";

    } catch (error) {
        responseBox.textContent = "Unable to connect to the server.";
    }
}
</script>

</body>
</html>
