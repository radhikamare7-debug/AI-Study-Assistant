<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Generator - AI Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            color: #1e293b;
        }

        header {
            background: #4338ca;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #312e81;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message {
            margin-top: 15px;
            color: #dc2626;
        }

        a {
            color: #4338ca;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📝 AI Quiz Generator</h1>
    <p>Test Your Engineering Knowledge</p>
</header>

<main>

    <h2>Generate Your Quiz</h2>

    <p>Enter your subject and topic below.</p>

    <form method="POST" action="{{ url_for('quiz_generator') }}">

        <input
            type="text"
            name="subject"
            placeholder="Enter Subject (Example: Operating System)"
            required
        >

        <input
            type="text"
            name="topic"
            placeholder="Enter Topic (Example: Process Management)"
            required
        >

        <select name="num_questions">
            <option value="5">5 Questions</option>
            <option value="10">10 Questions</option>
            <option value="15">15 Questions</option>
        </select>

        <button type="submit">Generate Quiz</button>

    </form>

    {% if error %}
        <div class="message">{{ error }}</div>
    {% endif %}

    {% if answer %}
        <div class="result">
            <h3>📚 Generated Quiz</h3>
            {{ answer }}
        </div>
    {% endif %}

    <br>

    <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>

</main>

</body>
</html>
